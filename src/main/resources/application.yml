spring:
  application:
    name: itmo-team-runner

  profiles:
    default: dev

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

runner:
  submission-queue:
    consumer-group: "runners-group"
    poll-timeout-ms: 2000
    recovery:
      enabled: true
      delay-ms: 60000
      min-idle-ms: 300000
      batch-size: 100