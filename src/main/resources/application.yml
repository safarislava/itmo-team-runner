spring:
  application:
    name: itmo-team-runner

  profiles:
    default: dev

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

runner:
  isolate:
    command-timeout-ms: 60000
  lease:
    ttl-ms: 90000
    renew-interval-ms: 30000
    max-duration-ms: 600000
    max-retries: 3
  submission-queue:
    consumer-group: "runners-group"
    poll-timeout-ms: 2000