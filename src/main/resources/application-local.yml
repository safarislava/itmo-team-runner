spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/dev
    username: postgres
    password: postgres

  data:
    redis:
      host: localhost
      port: 6379

storage:
  s3:
    bucket: itmo-resumes
    endpoint: http://localhost:9000
    region: us-east-1
    access-key: minioadmin
    secret-key: minioadmin
    path-style-access-enabled: true

runner:
  isolate:
    mode: docker
    docker:
      container: isolate-sandbox
